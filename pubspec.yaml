name: getx_starter_kit
description: "GetX 기반 Flutter 앱의 기본 프레임. BaseView / BaseController / BaseBinding / PageState 를 제공하고, 네트워크 계층은 flutter_api_kit 을 사용합니다."
version: 2.0.0
homepage: https://github.com/cwi112/getx-starter-kit
publish_to: 'none'

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # 상태관리, 라우팅, DI
  get: ^4.7.2

  # 로그 타입 (Logger)
  logger: ^2.5.0

  # 네트워크 · Failure · 유틸 (상태관리 무관 계층, re-export)
  flutter_api_kit:
    git:
      url: https://github.com/cwi112/flutter-api-kit.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
